name: Daily National Risk Digest

"on":
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run collection
        run: python scripts/collect_digest.py
        env:
          USER_AGENT: "DailyReview (https://github.com/nationalriskreview/DailyReview)"
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT: dailyreview-496300
          WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
          METRA_API_KEY: ${{ secrets.METRA_API_KEY }}
          BAY_511_API_KEY: ${{ secrets.BAY_511_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRIVATE_PROVIDERS_JSON: ${{ secrets.PRIVATE_PROVIDERS_JSON }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          git push

      - name: Push private service outages
        if: ${{ always() }}
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_REPO_TOKEN" ]; then
            echo "PRIVATE_REPO_TOKEN not set — skipping private push"; exit 0
          fi
          if [ ! -f private_out/service-outages-private.json ]; then
            echo "No private output present — skipping"; exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/nationalriskreview/DailyReview-private.git" \
            "$RUNNER_TEMP/priv" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/priv/data"
          cp private_out/service-outages-private.json "$RUNNER_TEMP/priv/data/service-outages-private.json"
          cd "$RUNNER_TEMP/priv"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/service-outages-private.json
          git diff --staged --quiet || git commit -m "Private service outages $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push 2>/dev/null
